server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # SPA fallback: a hard refresh on /meetings/42 must serve index.html, not 404.
    try_files $uri $uri/ /index.html;
  }

  # NOTE: deliberately no /api or /socket.io proxy block here. The Ingress splits those
  # paths off to the backend before traffic ever reaches this container
  # (manifests/kairos/50-ingress.yaml). A proxy here would be dead config at best.
}
